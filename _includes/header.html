<header class="site-header">
  <div class="container site-header__inner">
    <a class="site-nav__link site-nav__link--home" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>

    <nav class="site-nav" aria-label="Primary">
      <div class="site-nav__group">
        <a class="site-nav__link" href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
        <a class="site-nav__link" href="{{ '/vitae/' | relative_url }}"{% if page.url == '/vitae/' %} aria-current="page"{% endif %}>Vitae</a>
        <a class="site-nav__link" href="{{ '/group-members/' | relative_url }}"{% if page.url == '/group-members/' %} aria-current="page"{% endif %}>Group Members</a>
        <a class="site-nav__link" href="{{ '/research/' | relative_url }}"{% if page.url == '/research/' %} aria-current="page"{% endif %}>Research</a>
        <a class="site-nav__link" href="{{ '/publications/' | relative_url }}"{% if page.url == '/publications/' %} aria-current="page"{% endif %}>Publications</a>
        <a class="site-nav__link" href="{{ '/blog-posts/' | relative_url }}"{% if page.url == '/blog-posts/' %} aria-current="page"{% endif %}>Blog Posts</a>
      </div>

      <div class="site-nav__group site-nav__group--external" aria-label="External links">
        <a class="site-nav__icon-link" href="https://www.linkedin.com/in/placeholder" rel="noreferrer" aria-label="LinkedIn" title="LinkedIn">
          <svg class="site-nav__icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="7.25" cy="8.2" r="1.4"></circle>
            <path d="M6.1 10.8H8.4V17.8H6.1V10.8Z"></path>
            <path d="M10.05 10.8H12.25V11.75C12.87 11.03 13.74 10.62 14.82 10.62C16.86 10.62 17.9 11.94 17.9 14.31V17.8H15.62V14.69C15.62 13.45 15.16 12.81 14.15 12.81C13.11 12.81 12.33 13.53 12.33 14.83V17.8H10.05V10.8Z"></path>
          </svg>
          <span class="sr-only">LinkedIn</span>
        </a>
        <a class="site-nav__icon-link" href="https://x.com/placeholder" rel="noreferrer" aria-label="Twitter/X" title="Twitter/X">
          <svg class="site-nav__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 6.5L11.2 12L7.25 17.5H9.55L12.25 13.75L15.15 17.5H17.5L13.05 11.75L16.8 6.5H14.5L12 9.98L9.35 6.5H7Z"></path>
          </svg>
          <span class="sr-only">Twitter/X</span>
        </a>
        <a class="site-nav__icon-link" href="https://scholar.google.com/citations?user=placeholder" rel="noreferrer" aria-label="Google Scholar" title="Google Scholar">
          <svg class="site-nav__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5.75L5.2 9.35L12 12.9L18.8 9.35L12 5.75Z"></path>
            <path d="M8.2 11.35V15.2C8.2 16.9 9.9 18.25 12 18.25C14.1 18.25 15.8 16.9 15.8 15.2V11.35L12 13.3L8.2 11.35Z"></path>
          </svg>
          <span class="sr-only">Google Scholar</span>
        </a>
      </div>
    </nav>
  </div>
</header>
