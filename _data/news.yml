- date: 2026-09-14
  text: >-
    New paper: [How good are frontier models at physics?](https://arxiv.org/abs/2609.13009)
    Expert re-grading shows that leading physics benchmarks are broken, and that, contrary to what
    their published scores suggest, frontier models are close to saturating them.
  tweet: https://x.com/ZeyiAndyLiu/status/2099559337299443956

